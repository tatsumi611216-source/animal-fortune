<style>
/* Layout: 一枚の答案用紙（方眼）を縦に進む。上に成績表ストリップ、合否は朱色の判子 */
:root{
  --bg:#E6EBF1; --sheet:#FBFCFD; --ink:#16233F; --sub:#5D6880; --line:#C9D2DE;
  --grid:rgba(43,92,184,.07); --red:#C42A31; --blue:#2B5CB8; --ok:#2E7D4F; --warn:#A96F12;
  --chip:#EEF2F8;
  --f-disp:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D121B; --sheet:#151C29; --ink:#E4E9F2; --sub:#98A4BA; --line:#2B3548;
  --grid:rgba(110,152,232,.06); --red:#EA5A61; --blue:#7CA2EC; --ok:#5DC28A; --warn:#E1AA4D; --chip:#1D2635;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D121B; --sheet:#151C29; --ink:#E4E9F2; --sub:#98A4BA; --line:#2B3548;
  --grid:rgba(110,152,232,.06); --red:#EA5A61; --blue:#7CA2EC; --ok:#5DC28A; --warn:#E1AA4D; --chip:#1D2635;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
#app{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.sheet{background-color:var(--sheet);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:20px 20px;border:1px solid var(--line);border-radius:4px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(34px,9vw,58px);line-height:1.1;margin:0;letter-spacing:.02em;text-wrap:balance}
h1 .red{color:var(--red)}
h2{font-family:var(--f-disp);font-weight:400;font-size:22px;line-height:1.3;margin:0;text-wrap:balance}
.eyebrow{font-family:var(--f-num);font-size:12px;letter-spacing:.12em;color:var(--sub);text-transform:uppercase}
p{margin:0}
.sub{color:var(--sub);font-size:13px}
.lead{font-size:16px}
.btn{font:inherit;font-weight:700;border:2px solid var(--ink);background:var(--ink);color:var(--sheet);padding:10px 18px;border-radius:3px;cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.card{border:1px solid var(--line);background:var(--sheet);border-radius:3px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.choice{text-align:left;font:inherit;color:var(--ink);background:var(--sheet);border:1.5px solid var(--line);border-radius:3px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.choice:hover{border-color:var(--ink)}
.choice b{font-size:15px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
/* 成績表 */
.report{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);padding-block:10px}
.stat{display:flex;flex-direction:column;gap:3px;min-width:0}
.stat .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.stat .lab .num{color:var(--ink);font-weight:600}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.bar.r i{background:var(--red)}
.bar.b i{background:var(--blue)}
.profile{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border-radius:2px;padding:2px 8px;font-size:12px}
/* 時間配分 */
.alloc{display:flex;flex-direction:column;gap:8px}
.arow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;border-bottom:1px dashed var(--line);padding-bottom:8px}
.arow .t b{display:block}
.arow .t span{font-size:12px;color:var(--sub)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;font:inherit;font-size:18px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:3px;cursor:pointer}
.stepper .num{width:22px;text-align:center;font-size:18px}
.pips{grid-column:1/-1;display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.pips i{height:5px;background:var(--chip);border-radius:1px}
.pips i.on{background:var(--blue)}
.remain{font-family:var(--f-num);font-size:13px}
/* ログ */
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.log li{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:baseline}
.log .y{font-family:var(--f-num);font-size:12px;color:var(--sub)}
.log .d{font-size:12px;color:var(--sub)}
.fx{font-family:var(--f-num);font-size:12px;color:var(--blue)}
.fx.bad{color:var(--red)}
/* 判子 */
.results{display:flex;flex-direction:column;gap:10px}
.res{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px}
.hanko{width:66px;height:66px;border-radius:50%;border:3px solid var(--red);color:var(--red);display:grid;place-items:center;font-family:var(--f-disp);font-size:16px;transform:rotate(-12deg);animation:stamp .35s ease-out both}
.hanko.ng{border-color:var(--sub);color:var(--sub);border-style:dashed}
@keyframes stamp{from{transform:rotate(-12deg) scale(1.6);opacity:.2}to{transform:rotate(-12deg) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.hanko{animation:none}}
select{font:inherit;color:var(--ink);background:var(--sheet);border:1.5px solid var(--line);border-radius:3px;padding:8px;width:100%;min-height:44px}
.slot{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center}
.slot .d{font-family:var(--f-num);font-weight:600}
.quote{border-left:4px solid var(--red);padding:6px 0 6px 14px;font-size:17px;font-weight:700}
.ending h2{font-size:30px;color:var(--red)}
.check{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:3px;padding:8px 12px;cursor:pointer}
.check input{width:20px;height:20px}
.check .j{margin-left:auto;font-family:var(--f-num);font-size:13px}
.jA{color:var(--ok)} .jB{color:var(--ok)} .jC{color:var(--warn)} .jD{color:var(--red)} .jE{color:var(--red)}
.note{font-size:12px;color:var(--sub);border-top:1px solid var(--line);padding-top:10px}
.warn{color:var(--red);font-size:13px;font-weight:700}
</style>

/* ---------- 描画部品 ---------- */
function statsHTML(){
  const ph=S.phase, mode=ph.startsWith('es')?'es':(ph==='uni'||ph==='end'||ph==='adult')?'uni':'ms';
  const bar=(lab,v,c='')=>`<div class="stat"><div class="lab"><span>${lab}</span><span class="num">${Math.round(v)}</span></div><div class="bar ${c}"><i style="width:${v}%"></i></div></div>`;
  let first;
  if(mode==='uni') first=bar('ダーク度',S.dark,'r');
  else {const dev=mode==='es'?devES():devU();first=`<div class="stat"><div class="lab"><span>${mode==='es'?'模試偏差値（SAPIX換算）':'大学模試偏差値（河合換算）'}</span><span class="num">${dev}</span></div><div class="bar b"><i style="width:${(dev-30)/48*100}%"></i></div></div>`}
  const warn=mode!=='es'&&S.yoku>=60?`<p class="warn">抑圧が限界に近い。${mode==='ms'?'大学に入った瞬間に暴発しやすい状態です':'暴発するか、内側に向かうか'}</p>`:'';
  return `<div class="report">${first}
    ${mode!=='es'?bar('抑圧',S.yoku,'r'):''}${bar('異性慣れ',S.ikei,'b')}${bar('男友達',S.bro)}${bar('自己肯定感',S.jiko)}${bar('こじらせ',S.koji,'r')}${bar('大学幻想',S.gen,'r')}
  </div>${warn}`;
}
function headHTML(eyebrow,title){
  return `<div class="row" style="justify-content:space-between"><span class="eyebrow">${eyebrow}</span><span class="sub">${S.name}${S.school?'／'+sc().n:''}</span></div><h2>${title}</h2>`;
}
function allocHTML(cats){
  const used=Object.values(S.alloc).reduce((a,b)=>a+b,0), left=10-used;
  return `<div class="row" style="justify-content:space-between"><b>1年の時間配分</b><span class="remain">残り <b>${left}</b> / 10</span></div>
  <div class="alloc">${cats.map(c=>`<div class="arow"><div class="t"><b>${c.n}</b><span>${c.d}</span></div>
    <div class="stepper"><button data-act="dec" data-k="${c.k}" aria-label="${c.n}を減らす">−</button><span class="num">${S.alloc[c.k]}</span><button data-act="inc" data-k="${c.k}" aria-label="${c.n}を増やす">＋</button></div>
    <div class="pips">${Array.from({length:10},(_,i)=>`<i class="${i<S.alloc[c.k]?'on':''}"></i>`).join('')}</div></div>`).join('')}</div>`;
}
function logHTML(items){return `<ul class="log">${items.map(l=>`<li><span class="y">${l.y}</span><div>${l.t}${l.fx?`<div class="fx ${/-/.test(l.fx)&&!/こじらせ\+|大学幻想\+/.test(l.fx)?'':''}">${l.fx}</div>`:''}</div></li>`).join('')}</ul>`}
function render(html){app.innerHTML=html;window.scrollTo(0,0)}

function live(){
  const a=S.alloc, out=[];
  if(S.phase==='uni'){}
  else if(S.phase==='es'){
    const J=JUKU[S.juku]; let st=a.study;
    if(st<5&&S.oya>=4){st+=2;out.push({y:ESY[S.y],t:'親が勝手に塾の自習室を予約していた（勉強+2）',fx:eff({jiko:-3})});}
    S.g+=st*J.m; S.ikei+=a.girls*3+a.play*.5; S.comm+=a.play*.04+a.girls*.05;
    S.jiko+=a.sport*1.5+a.play*.5-2; S.koji+=a.game*.8; S.bro+=a.play*1.2+a.sport*.6; norm();
    const ev=pick(ES_EV.filter(e=>e.c(a)));
    out.push({y:ESY[S.y],t:ev.t,fx:Object.keys(ev.e).length?eff(ev.e):''});
    if(S.y===2&&a.study>=5) out.push({y:'小6',t:'夏期講習と正月特訓。1日12時間、塾にいた',fx:eff({g:3,jiko:-3})});
  }else{
    const s=sc(), Y=MSY[S.y];
    S.gh+=a.study*(S.j/60)*(1+s.sh/20); S.hob=(S.hob||0)+a.hobby;
    S.ikei+=s.ryo?-2:a.outside*s.ikeiF*(.5+S.comm*.15)*1.6-(a.outside===0?2:0);
    S.bro+=a.bros*2.2+a.club*.8+(s.ryo?3:0);
    S.jiko+=a.club*.8+(a.study>=6?1.5:0)+(s.jiyu?1:0)-1;
    let kj=S.ikei<35?a.hobby*.9+a.bros*.5:a.hobby*.25; kj-=a.outside*.4; if(s.jiyu)kj*=.85; if(s.ryo)kj+=2;
    S.koji+=kj; S.gen+=S.ikei<35?3+R()*4:-3; S.comm+=a.outside*.05;
    S.yoku+=((3-a.outside)*2.2+a.study*.5+(s.ryo?6:0)+(a.bros+a.hobby>=6?1:0))*smartMul()-a.outside*1.5-(S.ikei>=50?3:0); norm();
    const ev=s.ryo?pick(RYO_EV):pick(MS_EV.filter(e=>e.c(a,S.y)));
    out.push({y:Y,t:ev.t,fx:eff(ev.e)});
    if(s.ryo&&R()<.5){const ev2=pick(RYO_EV.filter(x=>x!==ev));out.push({y:Y,t:ev2.t,fx:eff(ev2.e)})}
    if(CHOICES[S.y]) S.choice=Object.assign(CHOICES[S.y](),{done:false});
  }
  if(S.phase==='uni') liveUni(a,out);
  out.forEach(l=>S.log.push(l));
  S.report=out;
}

function nextEpisode(){
  if(S.route==='dark'&&S.ai===0) return EP.deepen.mk();
  const cand=Object.entries(EP).filter(([k,e])=>!S.used[k]||['deepen','kids','date','propose','ghibli','alone'].includes(k)).map(([k,e])=>[k,e.w()]).filter(([,w])=>w>0);
  const tot=cand.reduce((a,[,w])=>a+w,0);let r=R()*tot,k=cand.length?cand[0][0]:'alone';
  for(const [kk,w] of cand){r-=w;if(r<=0){k=kk;break}}
  S.used[k]=1;S.epKey=k;return EP[k].mk();
}
function startAdult(){
  S.tier=(m=>m>=85?0:m>=68?1:m>=45?2:3)(calcMoney());
  const conv=Math.round(S.yoku*.4);S.dark+=conv;S.yoku*=.5;norm();
  S.phase='adult';S.ai=0;S.st='single';S.kids=0;S.used={};S.alog=[];
  S.route=S.dark>=50?'dark':'light';S.wasDark=S.route==='dark';
  S.count=S.route==='dark'?ri(10,30):ri(0,4);
  if(conv>=10)log('22歳',`中高と大学で抱えた抑圧が、ダーク度に変わった（+${conv}）`);
  if(S.route==='dark')log('22歳','社会人になった時点で、すでにダークサイドにいた');
  S.ep=nextEpisode();S.ep.done=false;vEp();
}
function vEp(){
  const e=S.ep, age=AGES[S.ai], last=S.ai===AGES.length-1;
  render(`<section class="sheet">${headHTML('社会人編',`${age}`)}
    <div class="row"><span class="chip" style="${S.route==='dark'?'color:var(--red);font-weight:700':''}">${S.route==='dark'?'ダークの道':'普通の道'}</span><span class="chip">${ST_LABEL[S.st]}${S.kids?'・子'+S.kids+'人':''}</span><span class="chip">資産：${TIER[S.tier]}</span>${S.count>=10?`<span class="chip">遊んだ人数 ${S.count}人</span>`:''}</div>
    ${statsHTML()}
    <div class="card" style="border-color:var(--ink)"><p>${e.t}</p>
      ${!e.done?`<div class="grid2" style="margin-top:8px">${e.o.map((o,i)=>`<button class="choice" data-act="epChoose" data-i="${i}"><b>${o.l}</b></button>`).join('')}</div>`
        :`<p style="margin-top:8px"><b>【${e.picked}】</b>${e.res}</p><div class="fx">${e.fx}</div>${e.turn?`<p class="warn">${e.turn}</p>`:''}`}
    </div>
    ${e.done?`<div class="row"><button class="btn ${last?'red':''}" data-act="epNext">${last?'50歳へ':'次の数年へ'}</button></div>`:''}
  </section>`);
}

function calcMoney(){
  const c=CAREERS.find(x=>x.id===S.career);
  let m;
  if(c.id==='kigyo'){const r=R();m=r<.2?95:r<.45?75:r<.7?55:25}
  else m=c.base+(R()+R()-1)*c.sd;
  m+=(S.jiko-50)*.15+(S.j-55)*.2+S.kakei*3;
  return m;
}

function pickPath(tier){
  const ik=S.ikei, br=S.bro, hob=S.hob||0, st=S.st, wed=st==='married'||st==='remarried';
  let id;
  if(S.route==='dark'){
    if(wed) id=S.ronpa>=1&&smart()?'moraharu':S.career==='doctor'?'isha':S.papa?'papa':S.affair?'isha':'spec';
    else if(S.affair&&S.found) id='furin';
    else if(S.ronpa>=2) id='moraharu';
    else if(S.scammed) id='scam';
    else if(S.xacc) id='misogyny';
    else if(S.papa) id='papa';
    else if(S.count>=80) id=smart()?'nanpa':'player';
    else if(rich()&&S.ai>=5) id=R()<.5?'toshinosa':'player';
    else if(hob>=10) id='conka';
    else id=smart()&&R()<.5?'misogyny':'player';
  }else{
    if(wed&&S.ghibli) id='redeemed';
    else if(st==='remarried') id='saikon';
    else if(wed){
      const C=[['family',3],['shokuba',2]];
      if((S.ikeiES||0)>=20)C.push(['osananajimi',2]);
      if(['ib','shosha'].includes(S.career))C.push(['kokusai',1.5]);
      if(br>=50)C.push(['doukino',2]);
      if(ik<35)C.push(['spec',S.joken?6:2]);else if(ik<45)C.push(['bloomer',2]);
      if(S.wasDark)C.push(['redeemed',4]);
      let r=R()*C.reduce((a,[,w])=>a+w,0);id=C[0][0];for(const [k,w] of C){r-=w;if(r<=0){id=k;break}}
    }
    else if(st==='divorced') id=S.affair?'furin':S.ronpa>=2?'moraharu':'divorce';
    else id=br>=55?'bros':hob>=15?'otaku':S.tier>=2&&R()<.5?'kodomobeya':S.tier<=1?'fire':'late';
  }
  return {id,darkRate:Math.round(S.dark)};
}
const CLOSE={late:'50歳、独身。まだ「次こそ」と思っている自分に、少しだけ笑ってしまう。'};
function vEnding(){
  const u=S.univ, pres=u.dev, ry=sc().ryo, tier=S.tier;
  const ik=S.ikei, kj=S.koji, br=S.bro;
  const {id}=pickPath(tier), P=PATHS[id];
  const wed=S.st==='married'||S.st==='remarried';
  let close=CLOSE[id]||P.s(tier)[3];
  if(id==='papa')close=wed?'50歳、家族はいる。でも家に帰る前に、いつも駅前で時間をつぶしている。金を払わなくても隣にいてくれる人は、たぶんいない。':'50歳、資産はある。食事の相手もいる。ただ、金を払わなくても隣にいてくれる人は一人もいない。';
  if(ry)close+=' 12歳からの6年間の寮生活は、家族と過ごす10代と引き換えだった。';
  const tag=ST_LABEL[S.st]+(S.kids?'・子'+S.kids+'人':'');
  const car=CAREERS.find(c=>c.id===S.career);
  const adult=S.log.filter(l=>AGES.includes(l.y));
  const why=[
    `地頭 ${grade(S.j)}（${S.j}）・${sc().n}・${u.n}`,
    `中高6年で積んだ異性慣れ ${Math.round(S.ikeiMS??ik)}${(S.ikeiMS??ik)<25?'（ほぼゼロ）':(S.ikeiMS??ik)<35?'（かなり少ない）':(S.ikeiMS??ik)<55?'（少なめ）':'（十分）'}`,
    `中高で溜めた抑圧 ${Math.round(S.yokuMS||0)} → 50歳時点のダーク度 ${Math.round(S.dark)}`,
    S.wasDark?(S.route==='dark'?'一度ダークの道に入り、最後まで抜け出せなかった':'一度ダークの道に入ったが、途中で抜け出した'):'ダークの道には入らなかった'
  ];
  if(S.j>=62&&(S.ikeiMS??ik)<35)why.push('頭がいいのに、中高で女子と関わらなかった。その空白を、大人になってから金と頭で埋めようとした');
  const got=[`${u.n}${pres>=65?'（世間的には勝ち組）':''}`];
  if(tier<=1)got.push(tier===0?'一生困らない金':'人並み以上の収入');
  if(S.kids)got.push('子ども');
  if(br>=50)got.push('一生続く男友達');
  if(S.ghibli)got.push('ダークの道から引き戻してくれた人');
  if(id==='otaku')got.push('誰にも邪魔されない好きなもの');
  if(id==='fire')got.push('自分で選んだひとりの時間');
  const lost=[];
  if((S.ikeiMS??ik)<40)lost.push('思春期に女子と日常的に話す6年間');
  if(S.count>=50)lost.push(`一人の相手と向き合う時間（遊んだ人数${S.count}人）`);
  if(S.papa)lost.push('金を払わなくても隣にいてくれる人');
  if(S.st==='divorced')lost.push('家族と暮らす毎日');
  if(S.xacc)lost.push('女性を一人の人間として見る目');
  if(S.scammed)lost.push('人を信じる力と数千万円');
  if(tier===3)lost.push('金の余裕');
  if(ry)lost.push('家族と過ごす10代');
  if(!lost.length)lost.push('大きなものは失わなかった。自分で取りに行ったから');
  S.phase='end';
  render(`<section class="sheet ending">
    <span class="eyebrow">50歳 · 答え合わせ</span>
    <h2>${P.t}</h2>
    <div class="row"><span class="chip">資産：${TIER[tier]}</span><span class="chip">${tag}</span><span class="chip">${car.n}</span>${S.count>=10?`<span class="chip">遊んだ人数 ${S.count}人</span>`:''}${S.route==='dark'?'<span class="chip" style="color:var(--red)">ダークサイド</span>':S.wasDark?'<span class="chip" style="color:var(--ok)">ダークから帰還</span>':''}</div>
    <p class="lead">${close}</p>
    <div class="stat"><div class="lab"><span>最終ダーク度</span><span class="num">${Math.round(S.dark)}</span></div><div class="bar r"><i style="width:${S.dark}%"></i></div></div>
    <div class="card"><b>23歳から50歳まで</b>${logHTML(adult)}</div>
    <div class="card"><b>この人生の分岐要因</b>${why.map(w=>`<span class="sub">・${w}</span>`).join('')}</div>
    <div class="grid2">
      <div class="card"><b>得たもの</b>${got.map(g=>`<span>・${g}</span>`).join('')}</div>
      <div class="card"><b>失ったもの</b>${lost.map(g=>`<span>・${g}</span>`).join('')}</div>
    </div>
    <div class="row"><span class="chip">${JUKU[S.juku].n}</span><span class="chip">見た目 ${stars(S.looks)}</span><span class="chip">コミュ力 ${stars(S.comm)}</span></div>
    <div class="row"><button class="btn red" data-act="restart">別の人生を生きる</button></div>
  </section>
  <section class="sheet"><span class="eyebrow">年表</span>${logHTML(S.log)}</section>`);
}

app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;ACT[b.dataset.act]&&ACT[b.dataset.act](b.dataset)});
newChar();vStart();
</script>
