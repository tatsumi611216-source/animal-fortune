// ===== 動物番号の算出 (個性心理学の標準アルゴリズム) =====
// 各年の基準値テーブル(1925-2030) ※(年基準 + 月基準 + 日) mod 60
function getAnimalNumber(y, m, d) {
  // 通日方式: 1925/1/1 を基準に経過日数を 60 で割った余り + オフセット
  // 個性心理学の公式: 番号 = (mod60(年補正) + 月補正 + 日) を60で正規化
  const yearMod = [ // 年の下2桁ではなく西暦からの算出
  ];
  // 月補正テーブル (1月〜12月)
  const monthAdd = [0,31,59,30,0,31,1,32,3,33,4,34];
  // 年補正: (y-1) のうるう年込み通算からの剰余
  let yBase = (y - 1) * 365 + Math.floor((y-1)/4) - Math.floor((y-1)/100) + Math.floor((y-1)/400);
  // うるう年で3月以降は+1
  const isLeap = (y%4===0 && y%100!==0) || y%400===0;
  let leapAdj = (isLeap && m >= 3) ? 1 : 0;
  let total = yBase + monthAdd[m-1] + leapAdj + d;
  let num = total % 60;
  return num; // 0-59
}

}

  `;
  res.classList.remove('show');
  void res.offsetWidth; // reflow でアニメ再生
  res.classList.add('show');
  res.scrollIntoView({behavior:"smooth", block:"center"});
}
</script>
</body>
