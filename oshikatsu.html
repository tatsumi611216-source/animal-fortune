function getAnimalNumber(y,m,d){
  const monthAdd=[0,31,59,30,0,31,1,32,3,33,4,34];
  let yBase=(y-1)*365+Math.floor((y-1)/4)-Math.floor((y-1)/100)+Math.floor((y-1)/400);
  const isLeap=(y%4===0&&y%100!==0)||y%400===0;
  let leapAdj=(isLeap&&m>=3)?1:0;
  return (yBase+monthAdd[m-1]+leapAdj+d)%60;
}

function compatScore(me,you){
  const O=OSHI[me]; let base=58;
  if(O.good.includes(you)) base=92;
  else if(O.bad.includes(you)) base=36;
  else if(OSHI[you].good.includes(me)) base=80;
  else if(OSHI[you].bad.includes(me)) base=44;
  if(me===you) base=Math.max(base,72);
  const diff=Math.abs(O.score-OSHI[you].score);
  base+=(diff<6?6:diff>20?-6:0);
  return Math.max(20,Math.min(99,base));
}
function compatComment(s,me,you){

  if(s>=55) return `バランス型🎀 ${me}と${you}は推し方は違うけど、補い合えば良い推し友に。`;
  if(s>=44) return `刺激枠⚡ ${me}と${you}はスタイルが正反対。理解し合えれば新鮮、合わないと衝突も。`;
  return `要注意🔥 ${me}と${you}は推し活の価値観がぶつかりやすい。距離感を大事に。`;
