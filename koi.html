function getAnimalNumber(y,m,d){
  const monthAdd=[0,31,59,30,0,31,1,32,3,33,4,34];
  let yBase=(y-1)*365+Math.floor((y-1)/4)-Math.floor((y-1)/100)+Math.floor((y-1)/400);
  const isLeap=(y%4===0&&y%100!==0)||y%400===0;
  let leapAdj=(isLeap&&m>=3)?1:0;
  return (yBase+monthAdd[m-1]+leapAdj+d)%60;
}

// ===== 相性スコア計算（自分の動物 × 相手の動物）=====
function compatScore(me, you){
  const L=LOVE[me];
  let base=58;
  if(L.good.includes(you)) base=92;
  else if(L.bad.includes(you)) base=34;
  else if(LOVE[you].good.includes(me)) base=80;
  else if(LOVE[you].bad.includes(me)) base=42;
  if(me===you) base=Math.max(base,70); // 同じ動物は安定
  // 偏差値差で微調整（価値観の近さ）
  const diff=Math.abs(L.score-LOVE[you].score);
  base += (diff<6?6:diff>20?-6:0);
  return Math.max(20,Math.min(99,base));
}
function compatComment(s, me, you){
  if(s>=90) return `運命級💞 ${me}と${you}は惹かれ合う最高の相性。お互いの足りない部分を自然に補い合えます。`;
  if(s>=75) return `好相性💕 ${me}と${you}はうまくいきやすいペア。ちょっとの気遣いで長続きします。`;
  if(s>=55) return `努力で開花🌱 ${me}と${you}は最初すれ違うことも。価値観をすり合わせれば化けます。`;
  if(s>=45) return `刺激的⚡ ${me}と${you}は正反対。ハマれば濃いが、距離感の調整が鍵。`;
  return `試練の恋🔥 ${me}と${you}は地雷を踏みやすい組み合わせ。理解し合う努力が必須です。`;
}
