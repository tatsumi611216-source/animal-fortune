  "guren","guren","kaze","kokuyou","kokuyou","suiryoku","suiryoku","hakugin","hakugin","shien",
  "tsukuyomi","ouka","ouka","tsukuyomi","souten","kaze","kaze","souten","ten","raimei",
  "raimei","ten","kongou","guren","guren","kokuyou","ten","tsukuyomi","tsukuyomi","ouka"
];

function getNum(y,m,d){ const a=[0,31,59,30,0,31,1,32,3,33,4,34]; let b=(y-1)*365+Math.floor((y-1)/4)-Math.floor((y-1)/100)+Math.floor((y-1)/400); const lp=(y%4===0&&y%100!==0)||y%400===0; return (b+a[m-1]+((lp&&m>=3)?1:0)+d)%60; }

// 今の波動（設問）
const WANT_AXIS = { love:"愛とご縁の波動", money:"豊かさと勝負の波動", peace:"癒やしと浄化の波動", power:"突破と前進の波動" };
const WANT_TIP = {
  love:"人との縁を結ぶ時。心を開き、与えることから始めなさい。",
  money:"勝負と豊かさの時。守りに入らず、好機に踏み込みなさい。",
  peace:"立ち止まり、整える時。無理に進まず、自分を労わりなさい。",
  power:"道を切り拓く時。迷いを断ち、一歩を決めなさい。"
};
const STATE_WORD = { calm:"いま、あなたの波動は静かに整っている。", shake:"いま、あなたの波動は揺らぎ、わずかに乱れが見える。", burn:"いま、あなたの波動は熱く高ぶっている。" };
const FLOW_WORD  = { up:"運気は上昇の流れにある。追い風を逃さぬように。", flat:"運気は停滞の淵にある。今は波動を整える時。", down:"運気は下りの局面にある。だが、底を打てば必ず昇る。" };
const STATE_ADJ = { calm:6, shake:-8, burn:3 };
const FLOW_ADJ  = { up:6, flat:-3, down:-7 };

const yearSel=document.getElementById('year'),monthSel=document.getElementById('month'),daySel=document.getElementById('day');
for(let y=2025;y>=1930;y--)yearSel.add(new Option(y+"年",y));
for(let m=1;m<=12;m++)monthSel.add(new Option(m+"月",m));
function fillDays(){const y=+yearSel.value,m=+monthSel.value,dim=new Date(y,m,0).getDate(),cur=+daySel.value||1;daySel.innerHTML="";for(let d=1;d<=dim;d++)daySel.add(new Option(d+"日",d));if(cur<=dim)daySel.value=cur;}
yearSel.value=1990;monthSel.value=1;fillDays(); yearSel.onchange=fillDays;monthSel.onchange=fillDays;

function checkLine(){ if(LINE_URL.includes("XXXXXXX")){alert("（設定メモ）LINE_URLを差し替えてください。");return false;} return true; }
// LINEを開きつつ、ロックされた占いの続きを解放する
function goUnlock(){
  document.querySelectorAll('#result .locked').forEach(function(l){ l.classList.add('unlocked'); });
  return checkLine(); // 真ならLINEへ遷移、ダミーURL時は遷移せず解放のみ
}

(function(){ const t=new Date(); const seed=t.getFullYear()*1000+(t.getMonth()+1)*40+t.getDate();
  const today=1400+(seed*73%3600); const total=72000+(seed*131%34000);
  document.getElementById('socialProof').innerHTML=`🐉 本日 <b>${today.toLocaleString()}</b>名が霊視を受け／延べ <b>${total.toLocaleString()}</b>名を視てまいりました`; })();

function saveCard(){ const el=document.getElementById('captureArea'); if(!el||typeof html2canvas==='undefined'){alert("準備中です。");return;}
  html2canvas(el,{scale:2,backgroundColor:"#1a0d33"}).then(c=>{const a=document.createElement('a');a.download='守護龍診断_波動霊石院.png';a.href=c.toDataURL('image/png');a.click();}); }

function compatScore(me,you){ const S=RYU[me]; let b=58; if(S.good.includes(you))b=92; else if(S.bad.includes(you))b=38; else if(RYU[you].good.includes(me))b=80; else if(RYU[you].bad.includes(me))b=46; if(me===you)b=Math.max(b,74); return Math.max(25,Math.min(99,b)); }
function compatComment(s,me,you){ const a=RYU[me].name,b=RYU[you].name;
  if(s>=90)return `二龍は響き合う。${a}と${b}は互いの波動を高め合う、得難き縁。`;
  if(s>=75)return `${a}と${b}は心地よく調和する。共にあれば日々が整うだろう。`;
  if(s>=55)return `${a}と${b}は気質が異なる。違いを認め合えば、良き縁となる。`;
  return `${a}と${b}は波が異なる。間合いを大切にすれば、学びの縁となる。`; }
function shindanAisho(){ const me=window.__myRyu; if(!me){alert("先にソヨンに視てもらいなさい🐉");return;}
  const y=+document.getElementById('pyear').value,mo=+document.getElementById('pmonth').value,d=+document.getElementById('pday').value;
  const you=NUM_TO_RYU[getNum(y,mo,d)]; const s=compatScore(me,you);
  document.getElementById('aishoResult').innerHTML=`
    <div class="aisho-card">
      <div class="aisho-pair">${RYU[me].emoji} <span>×</span> ${RYU[you].emoji}</div>
      <div class="aisho-names">${RYU[me].name} × ${RYU[you].name}</div>
      <div class="aisho-score">龍の相性 <b>${s}</b><small>%</small></div>
      <div class="lm-bar" style="margin:8px 0;"><div class="lm-fill" style="width:${s}%;"></div></div>
      <div class="aisho-comment">${compatComment(s,me,you)}</div>
      <a class="unlock-btn" style="margin-top:12px;display:inline-block;" href="${LINE_URL}" target="_blank" rel="noopener" onclick="return checkLine();">📱 二人に合う石組みをLINEで視る</a>
    </div>`;
  document.getElementById('aishoResult').scrollIntoView({behavior:"smooth",block:"center"}); }

function uranau(){
  const y=+yearSel.value,m=+monthSel.value,d=+daySel.value;
  const key=NUM_TO_RYU[getNum(y,m,d)]; window.__myRyu=key; const S=RYU[key];
  const q1=document.getElementById('q1').value,q2=document.getElementById('q2').value,q3=document.getElementById('q3').value;
  const waveNow=Math.max(40,Math.min(99, S.wave + (STATE_ADJ[q1]||0) + (FLOW_ADJ[q3]||0)));
  const goodE=S.good.map(g=>RYU[g].emoji+RYU[g].name).join("・");
  const badE=S.bad.map(g=>RYU[g].emoji+RYU[g].name).join("・");
  const shareText=`【波動霊石院】院主ソヨンが視た私の守護龍は「${S.name}（${S.yomi}）」🐉\n${S.code}／波動レベル${waveNow}・上位${S.rarity}%！\nあなたの守護龍は？▼`;

  const res=document.getElementById('result');
  res.innerHTML=`
    <div id="captureArea" style="padding:14px;border-radius:20px;background:#1a0d33;">
    <div class="rarity-badge">🏆 上位 ${S.rarity}% の希少な守護龍</div>
    <div class="hero-card" style="background:linear-gradient(135deg,${S.color},${S.color}99);">
      <div class="aura"></div>
      <div class="hero-emoji">${S.emoji}</div>
      <div class="hero-nick">あなたの守護龍</div>
      <div class="hero-name">${S.name}</div>
      <div class="hero-yomi">― ${S.yomi} ―</div>
      <div class="hero-catch">${S.catch}</div>
    </div>
    <div class="wave-meter">
      <div class="lbl"><span>🐉 今のあなたの波動レベル</span><b>${waveNow}</b></div>
      <div class="lm-bar"><div class="lm-fill" id="waveFill"></div></div>
    </div>
    <div style="font-size:0.66rem;color:#7d6aa8;margin:-4px 0 12px;">― 波動霊石院 ―</div>
    </div><!-- /captureArea -->

    <div class="oracle"><h4>🔮 院主ソヨンのお告げ</h4><p>「${STATE_WORD[q1]}${FLOW_WORD[q3]}<br><br>${S.name}が、あなたに伝えたい言葉がある……」</p></div>

    <!-- 一点物の霊石（登録前でも見える＝販売導線） -->
    <div class="shoho">
      <div class="dragon">🐉✨</div>
      <h3>あなたに共鳴する“一点物の霊石”</h3>
      <p>院主ソヨンが浄化・波動調整した一点物の霊石。同じ波動の石は二つとありません。気になった石こそ、今のあなたに必要な縁です。</p>
      <a class="shoho-btn mercari" href="${SHOP_URL}" target="_blank" rel="noopener">🛒 一点物の霊石を見る（メルカリ）</a>
      <p class="shoho-note">一点物のため再入荷はありません。※エンタメ・お守り目的の品です。効果効能を保証するものではありません。</p>
    </div>

    <!-- 占いの続き＝LINE登録必須 -->
    <div class="locked">
      <div class="oracle"><h4>🔮 お告げの続き</h4><p>「${S.oracle}」</p></div>
      <div class="code-row">
        <div class="code-cell"><span>魂コード</span><b>${S.code}</b></div>
        <div class="code-cell"><span>波動軸</span><b>${S.jiku}</b></div>
      </div>
      <div class="sec"><h4>✨ 今あなたに必要な波動</h4>あなたが今求める「${WANT_AXIS[q2]}」。${WANT_TIP[q2]}</div>
      <div class="sec"><h4>💡 ${S.name}からあなたへの導き</h4>${S.advice}</div>
      <div class="compat">
        <div class="compat-box good"><span>🐉 響き合う龍</span><b>${goodE}</b></div>
        <div class="compat-box bad"><span>⚡ 間合いに注意</span><b>${badE}</b></div>
      </div>
      <div class="lock-overlay">
        <div class="big">🔒🐉</div>
        <p>占いの続き（お告げ全文・魂コード・今必要な波動・導き・相性の龍）は<br><b>ソヨンのLINE登録</b>で視られます</p>
        <a class="unlock-btn" href="${LINE_URL}" target="_blank" rel="noopener" onclick="return goUnlock();">📱 LINE登録で続きを視る</a>
      </div>
    </div>

    <button class="save-btn" onclick="saveCard()">📸 結果を画像で保存（SNSにシェア）</button>
    <div class="share-row">
      <a class="share-btn x" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(location.href)}" target="_blank" rel="noopener">𝕏 でシェア</a>
      <a class="share-btn ln" href="https://line.me/R/msg/text/?${encodeURIComponent(shareText+" "+location.href)}" target="_blank" rel="noopener">LINEで送る</a>
    </div>

    <p style="font-size:0.76rem;color:#a892d6;margin-top:10px;">あなたの誕生日：${y}年${m}月${d}日</p>

    <div class="line-cta">
      <h3>🐉 守護龍「${S.name}」を授かったあなたへ ― ソヨンより</h3>
      <div class="blur">2026年、あなたの波動が大きく動くのは◯月。今のあなたに必要な石組みは△△で、龍の導きが強まる時期は……（続きはLINEにて）</div>
      <ul class="line-list">
        <li>✅ あなたの守護龍・魂コードの全文リーディング</li>
        <li>✅ 2026年の波動の流れと開運の導き</li>
        <li>✅ あなたに共鳴する一点物の霊石の処方</li>
      </ul>
      <a class="line-btn" href="${LINE_URL}" target="_blank" rel="noopener" onclick="return checkLine();">📱 波動霊石院のLINEで続きを授かる</a>
      <p class="line-sub">友だち追加は無料 / ブロックはいつでもできます</p>
    </div>
  `;
  res.classList.remove('show'); void res.offsetWidth; res.classList.add('show');
  setTimeout(()=>{const f=document.getElementById('waveFill'); if(f)f.style.width=waveNow+"%";},150);
  res.scrollIntoView({behavior:"smooth",block:"start"});
}
</script>
</body>
</html>
