  onyx:{emoji:"🖤",name:"オニキス",nick:"守護と意志の守護石",color:COLORS.onyx,price:2780,rarity:2,wave:83,
    oracle:"あなたの波動は揺るがぬ岩のよう。だが孤独が影を落とす。オニキスが邪を退け、意志を支えるだろう。",
    mean:"「魔除け・守護の石」として親しまれる黒石。",
    advice:"抱え込まず、心を開ける者を持ちなさい。",
    keep:"守護・意志・集中",lucky:"ブラック",day:"土曜",good:["tiger","crystal"],bad:["rose"]},
  peridot:{emoji:"💚",name:"ペリドット",nick:"希望と再生の守護石",color:COLORS.peridot,price:3080,rarity:5,wave:80,
    oracle:"あなたの波動は朝陽のように昇る力を持つ。ペリドットが闇を払い、希望を灯し続けるだろう。",
    mean:"「太陽の石」と呼ばれ、希望と前向きさの象徴とされる石。",
    advice:"頑張りすぎは空回りを生む。休むのも前進だ。",
    keep:"希望・再生・人気",lucky:"ライトグリーン",day:"金曜",good:["garnet","turquoise"],bad:["amethyst"]}
};

const NUM_TO_STONE = [
  "rose","amethyst","citrine","tiger","amethyst","rose","garnet","aqua","aqua","garnet",
  "peridot","peridot","aqua","moon","moon","crystal","amethyst","crystal","garnet","tiger",
  "lapis","lapis","onyx","onyx","lapis","tiger","tiger","crystal","turquoise","turquoise",
  "citrine","citrine","turquoise","peridot","peridot","aqua","aqua","crystal","crystal","amethyst",
  "moon","rose","rose","moon","lapis","turquoise","turquoise","lapis","onyx","garnet",
  "garnet","onyx","tiger","citrine","citrine","peridot","onyx","moon","moon","rose"
];

function getNum(y,m,d){ const a=[0,31,59,30,0,31,1,32,3,33,4,34]; let b=(y-1)*365+Math.floor((y-1)/4)-Math.floor((y-1)/100)+Math.floor((y-1)/400); const lp=(y%4===0&&y%100!==0)||y%400===0; return (b+a[m-1]+((lp&&m>=3)?1:0)+d)%60; }

// 今の波動（設問）→ 必要な石・お告げ補正
const WANT_STONE = { love:"rose", money:"citrine", peace:"amethyst", power:"peridot" };
const WANT_WORD  = { love:"愛とご縁", money:"豊かさと成功", peace:"安らぎと癒やし", power:"前へ進む力" };
const STATE_WORD = { calm:"いま、あなたの波動は静かに整っている。", shake:"いま、あなたの波動は揺らぎ、わずかに乱れが見える。", burn:"いま、あなたの波動は熱く高ぶっている。" };
const FLOW_WORD  = { up:"運気は上昇の流れにある。追い風を逃さぬように。", flat:"運気は停滞の淵にある。今は石で流れを整える時。", down:"運気は下りの局面にある。だが、底を打てば必ず昇る。" };
// 波動レベル補正
const STATE_ADJ = { calm:6, shake:-8, burn:3 };
const FLOW_ADJ  = { up:6, flat:-3, down:-7 };

const yearSel=document.getElementById('year'),monthSel=document.getElementById('month'),daySel=document.getElementById('day');
for(let y=2025;y>=1930;y--)yearSel.add(new Option(y+"年",y));
for(let m=1;m<=12;m++)monthSel.add(new Option(m+"月",m));
function fillDays(){const y=+yearSel.value,m=+monthSel.value,dim=new Date(y,m,0).getDate(),cur=+daySel.value||1;daySel.innerHTML="";for(let d=1;d<=dim;d++)daySel.add(new Option(d+"日",d));if(cur<=dim)daySel.value=cur;}
yearSel.value=1990;monthSel.value=1;fillDays(); yearSel.onchange=fillDays;monthSel.onchange=fillDays;

function checkLine(){ if(LINE_URL.includes("XXXXXXX")){alert("（設定メモ）LINE_URLを差し替えてください。");return false;} return true; }

(function(){ const t=new Date(); const seed=t.getFullYear()*1000+(t.getMonth()+1)*40+t.getDate();
  const today=1400+(seed*73%3600); const total=72000+(seed*131%34000);
  document.getElementById('socialProof').innerHTML=`🐉 本日 <b>${today.toLocaleString()}</b>名が霊視を受け／延べ <b>${total.toLocaleString()}</b>名を視てまいりました`; })();

function saveCard(){ const el=document.getElementById('captureArea'); if(!el||typeof html2canvas==='undefined'){alert("準備中です。");return;}
  html2canvas(el,{scale:2,backgroundColor:"#1a0d33"}).then(c=>{const a=document.createElement('a');a.download='守護霊石診断_波動霊石院.png';a.href=c.toDataURL('image/png');a.click();}); }

function compatScore(me,you){ const S=STONE[me]; let b=58; if(S.good.includes(you))b=92; else if(S.bad.includes(you))b=38; else if(STONE[you].good.includes(me))b=80; else if(STONE[you].bad.includes(me))b=46; if(me===you)b=Math.max(b,74); return Math.max(25,Math.min(99,b)); }
function compatComment(s,me,you){ const a=STONE[me].name,b=STONE[you].name;
  if(s>=90)return `二つの波動は響き合う。${a}と${b}は重ね持つことで力を増す、得難き組み合わせ。`;
  if(s>=75)return `${a}と${b}は心地よく調和する。共に身につければ日々が整うだろう。`;
  if(s>=55)return `${a}と${b}は個性が異なる。場に応じて使い分けるがよい。`;
  return `${a}と${b}は波が異なる。シーンを分けて持つことを勧める。`; }
function shindanAisho(){ const me=window.__myStone; if(!me){alert("先にソヨンに視てもらいなさい🐉");return;}
  const y=+document.getElementById('pyear').value,mo=+document.getElementById('pmonth').value,d=+document.getElementById('pday').value;
  const you=NUM_TO_STONE[getNum(y,mo,d)]; const s=compatScore(me,you);
  document.getElementById('aishoResult').innerHTML=`
    <div class="aisho-card">
      <div class="aisho-pair">${STONE[me].emoji} <span>×</span> ${STONE[you].emoji}</div>
      <div class="aisho-names">${STONE[me].name} × ${STONE[you].name}</div>
      <div class="aisho-score">波動の相性 <b>${s}</b><small>%</small></div>
      <div class="lm-bar" style="margin:8px 0;"><div class="lm-fill" style="width:${s}%;"></div></div>
      <div class="aisho-comment">${compatComment(s,me,you)}</div>
      <a class="unlock-btn" style="margin-top:12px;display:inline-block;" href="${LINE_URL}" target="_blank" rel="noopener" onclick="return checkLine();">📱 二人に合う石組みをLINEで視る</a>
    </div>`;
  document.getElementById('aishoResult').scrollIntoView({behavior:"smooth",block:"center"}); }

function uranau(){
  const y=+yearSel.value,m=+monthSel.value,d=+daySel.value;
  const key=NUM_TO_STONE[getNum(y,m,d)]; window.__myStone=key; const S=STONE[key];
  // 設問（今の波動）
  const q1=document.getElementById('q1').value, q2=document.getElementById('q2').value, q3=document.getElementById('q3').value;
  const waveNow=Math.max(40,Math.min(99, S.wave + (STATE_ADJ[q1]||0) + (FLOW_ADJ[q3]||0)));
  const needKey=WANT_STONE[q2]; const N=STONE[needKey]; const needBuy=BUY_LINKS[needKey]||SHOP_URL;
  const sameStone=(needKey===key);
  const goodE=S.good.map(g=>STONE[g].emoji+STONE[g].name).join("・");
  const badE=S.bad.map(g=>STONE[g].emoji+STONE[g].name).join("・");
  const buyUrl=BUY_LINKS[key]||SHOP_URL;
  const shareText=`【波動霊石院】院主ソヨンが視た私の守護霊石は「${S.name}」🐉 (${S.nick})\n波動レベル${waveNow} / 上位${S.rarity}%！\nあなたの守護霊石は？▼`;

  const res=document.getElementById('result');
  res.innerHTML=`
    <div id="captureArea" style="padding:14px;border-radius:20px;background:#1a0d33;">
    <div class="rarity-badge">🏆 上位 ${S.rarity}% の希少な守護霊石</div>
    <div class="hero-card" style="background:linear-gradient(135deg,${S.color},${S.color}99);">
      <div class="aura"></div>
      <div class="hero-emoji">${S.emoji}</div>
      <div class="hero-nick">${S.nick}</div>
      <div class="hero-name">${S.name}</div>
      <div class="hero-catch">守護の軸：${S.keep}</div>
    </div>
    <div class="wave-meter">
      <div class="lbl"><span>🐉 今のあなたの波動レベル</span><b>${waveNow}</b></div>
      <div class="lm-bar"><div class="lm-fill" id="waveFill"></div></div>
    </div>
    <div style="font-size:0.66rem;color:#7d6aa8;margin:-4px 0 12px;">― 波動霊石院 ―</div>
    </div><!-- /captureArea -->

    <div class="oracle"><h4>🔮 院主ソヨンのお告げ</h4><p>「${STATE_WORD[q1]}${FLOW_WORD[q3]}<br><br>${S.oracle}」</p></div>
    <div class="sec"><h4>💠 ${S.name}の意味（言い伝え）</h4>${S.mean}</div>

    ${sameStone ? `
    <div class="oracle" style="border-color:rgba(126,255,179,.4);">
      <h4>✨ 今あなたに必要な石</h4>
      <p>あなたが今求める「${WANT_WORD[q2]}」。それを司るのは、まさにあなたの守護霊石「${S.name}」そのもの。今このタイミングで持つべき石が、生まれ持った石と重なっている――稀なる導きです。</p>
    </div>` : `
    <div class="buy-box" style="border-color:rgba(126,255,179,.5);">
      <div style="font-size:0.78rem;color:#8effc0;font-weight:bold;margin-bottom:4px;">✨ 今あなたに必要な石</div>
      <div class="stone-img">${N.emoji}</div>
      <h3>${N.name}</h3>
      <p style="font-size:0.86rem;line-height:1.8;color:#ece4ff;margin:6px 0;">今のあなたが求める「${WANT_WORD[q2]}」を司る石。守護霊石「${S.name}」と重ね持つことで、今の波動を整える助けとなるでしょう。</p>
      <div class="price">¥${N.price.toLocaleString()}〜 <small>（${N.name}ブレスレット）</small></div>
      <a class="buy-btn" href="${needBuy}" target="_blank" rel="noopener">🛒 ${N.name}を授かる</a>
    </div>`}

    <div class="buy-box">
      <div class="stone-img">${S.emoji}✨</div>
      <h3>あなたの守護霊石「${S.name}」</h3>
      <div class="price">¥${S.price.toLocaleString()}〜 <small>（波動を込めた天然石ブレスレット）</small></div>
      <a class="buy-btn" href="${buyUrl}" target="_blank" rel="noopener">🛒 この守護霊石を授かる</a>
      <p class="buy-note">お守りとして身につけたい方へ。※医療・治療・効果効能を保証するものではありません</p>
    </div>

    <div class="lucky-row">
      <div class="lucky"><span>🎨 ラッキーカラー</span><b>${S.lucky}</b></div>
      <div class="lucky"><span>📅 ラッキー曜日</span><b>${S.day}</b></div>
      <div class="lucky"><span>💠 守護の軸</span><b>${S.keep}</b></div>
    </div>

    <div class="locked">
      <div class="sec"><h4>💡 ソヨンからあなたへの導き</h4>${S.advice}</div>
      <div class="compat">
        <div class="compat-box good"><span>💎 響き合う石</span><b>${goodE}</b></div>
        <div class="compat-box bad"><span>⚡ 組み合わせ注意</span><b>${badE}</b></div>
      </div>
      <div class="lock-overlay">
        <div class="big">🔒🐉</div>
        <p>「ソヨンからの導き」と「響き合う石」は<br>LINEで友だち追加すると視られます</p>
        <a class="unlock-btn" href="${LINE_URL}" target="_blank" rel="noopener" onclick="return checkLine();">📱 LINEで結果を授かる</a>
      </div>
    </div>

    <button class="save-btn" onclick="saveCard()">📸 結果を画像で保存（SNSにシェア）</button>
    <div class="share-row">
      <a class="share-btn x" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(location.href)}" target="_blank" rel="noopener">𝕏 でシェア</a>
      <a class="share-btn ln" href="https://line.me/R/msg/text/?${encodeURIComponent(shareText+" "+location.href)}" target="_blank" rel="noopener">LINEで送る</a>
    </div>

    <p style="font-size:0.76rem;color:#a892d6;margin-top:10px;">あなたの誕生日：${y}年${m}月${d}日</p>

    <div class="aisho-section">
      <h3>💎 大切な人との「波動の相性」</h3>
      <p class="aisho-sub">相手の生年月日を入れて視る（ペア・贈り物の石選びにも）</p>
      <div class="input-row">
        <div class="field"><label>年</label><select id="pyear"></select></div>
        <div class="field"><label>月</label><select id="pmonth"></select></div>
        <div class="field"><label>日</label><select id="pday"></select></div>
      </div>
      <button class="aisho-btn" onclick="shindanAisho()">波動の相性を視る 💠</button>
      <div id="aishoResult"></div>
    </div>

    <div class="line-cta">
      <h3>🐉 ${S.name}を授かったあなたへ ― ソヨンより</h3>
      <div class="blur">2026年、あなたの波動が大きく動くのは◯月。今のあなたに必要な石組みは△△で、龍の導きが強まる時期は……（続きはLINEにて）</div>
      <ul class="line-list">
        <li>✅ あなたの守護霊石・全文の霊視結果</li>
        <li>✅ 2026年の波動の流れと開運の導き</li>
        <li>✅ あなたに合う石組み・お守りの提案</li>
      </ul>
      <a class="line-btn" href="${LINE_URL}" target="_blank" rel="noopener" onclick="return checkLine();">📱 波動霊石院のLINEで続きを授かる</a>
      <p class="line-sub">友だち追加は無料 / ブロックはいつでもできます</p>
    </div>
  `;
  res.classList.remove('show'); void res.offsetWidth; res.classList.add('show');
  const py=document.getElementById('pyear'),pm=document.getElementById('pmonth'),pd=document.getElementById('pday');
  for(let yy=2025;yy>=1930;yy--)py.add(new Option(yy+"年",yy));
  for(let mm=1;mm<=12;mm++)pm.add(new Option(mm+"月",mm));
  py.value=1990;pm.value=1;
  const fp=()=>{const dim=new Date(+py.value,+pm.value,0).getDate();pd.innerHTML="";for(let dd=1;dd<=dim;dd++)pd.add(new Option(dd+"日",dd));};
  fp(); py.onchange=fp; pm.onchange=fp;
  setTimeout(()=>{const f=document.getElementById('waveFill'); if(f)f.style.width=S.wave+"%";},150);
  res.scrollIntoView({behavior:"smooth",block:"start"});
}
</script>
