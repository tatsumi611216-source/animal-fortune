function getNum(y,m,d){
  const monthAdd=[0,31,59,30,0,31,1,32,3,33,4,34];
  let yBase=(y-1)*365+Math.floor((y-1)/4)-Math.floor((y-1)/100)+Math.floor((y-1)/400);
  const isLeap=(y%4===0&&y%100!==0)||y%400===0; let leapAdj=(isLeap&&m>=3)?1:0;
  return (yBase+monthAdd[m-1]+leapAdj+d)%60;
}

function fillDays(){const y=+yearSel.value,m=+monthSel.value,dim=new Date(y,m,0).getDate(),cur=+daySel.value||1;daySel.innerHTML="";for(let d=1;d<=dim;d++)daySel.add(new Option(d+"日",d));if(cur<=dim)daySel.value=cur;}
yearSel.value=1990;monthSel.value=1;fillDays(); yearSel.onchange=fillDays;monthSel.onchange=fillDays;

function checkLine(){if(LINE_URL.includes("XXXXXXX")){alert("（設定メモ）LINE_URL を友だち追加URLに差し替えてください。");return false;}return true;}

(function(){ const t=new Date(); const seed=t.getFullYear()*1000+(t.getMonth()+1)*40+t.getDate();
  const today=1800+(seed*73%4200); const total=96000+(seed*131%38000);
  document.getElementById('socialProof').innerHTML=`👥 今日 <b>${today.toLocaleString()}</b>人が診断中／累計 <b>${total.toLocaleString()}</b>人突破！`;
})();

function saveCard(){ const el=document.getElementById('captureArea');
  if(!el||typeof html2canvas==='undefined'){alert("画像保存の準備中です。");return;}
  html2canvas(el,{scale:2,backgroundColor:"#ffffff"}).then(c=>{const a=document.createElement('a');a.download='守護石診断.png';a.href=c.toDataURL('image/png');a.click();}); }

function compatScore(me,you){ const S=STONE[me]; let base=58;
  if(S.good.includes(you))base=92; else if(S.bad.includes(you))base=38;
  else if(STONE[you].good.includes(me))base=80; else if(STONE[you].bad.includes(me))base=46;
  if(me===you)base=Math.max(base,74); return Math.max(25,Math.min(99,base)); }
function compatComment(s,me,you){ const a=STONE[me].name,b=STONE[you].name;
  if(s>=90)return `最高の組み合わせ💎 ${a}と${b}は互いの力を高め合う、重ね付けにも理想的なペア。`;
  if(s>=75)return `好相性✨ ${a}と${b}は一緒に持つと心地よく調和するとされる組み合わせ。`;
  if(s>=55)return `バランス型💠 ${a}と${b}は個性が違うぶん、状況で使い分けると◎。`;
  return `個性派⚡ ${a}と${b}は方向性が異なる組み合わせ。シーンを分けて持つのがおすすめ。`; }
function shindanAisho(){ const me=window.__myStone; if(!me){alert("先に守護石を占ってね🔮");return;}
  const y=+document.getElementById('pyear').value,mo=+document.getElementById('pmonth').value,d=+document.getElementById('pday').value;
  const you=NUM_TO_STONE[getNum(y,mo,d)]; const s=compatScore(me,you);
  document.getElementById('aishoResult').innerHTML=`
    <div class="aisho-card">
      <div class="aisho-pair">${STONE[me].emoji} <span>×</span> ${STONE[you].emoji}</div>
      <div class="aisho-names">${STONE[me].name} × ${STONE[you].name}</div>
      <div class="aisho-score">石の相性 <b>${s}</b><small>%</small></div>
      <div class="lm-bar" style="margin:8px 0;"><div class="lm-fill" style="width:${s}%;background:linear-gradient(90deg,#a18cd1,#6c5ce7);"></div></div>
      <div class="aisho-comment">${compatComment(s,me,you)}</div>
      <a class="unlock-btn" style="margin-top:12px;display:inline-block;" href="${LINE_URL}" target="_blank" rel="noopener" onclick="return checkLine();">📱 相性のいい石セットをLINEで見る</a>
    </div>`;
  document.getElementById('aishoResult').scrollIntoView({behavior:"smooth",block:"center"}); }

function uranau(){
  const y=+yearSel.value,m=+monthSel.value,d=+daySel.value;
  const key=NUM_TO_STONE[getNum(y,m,d)]; window.__myStone=key;
  const S=STONE[key];
  const goodE=S.good.map(g=>STONE[g].emoji+STONE[g].name).join("・");
  const badE=S.bad.map(g=>STONE[g].emoji+STONE[g].name).join("・");
  const buyUrl=S.buy||SHOP_URL;
  const shareText=`【守護石診断】私の守護石は「${S.name}」💎 (${S.nick})\n上位${S.rarity}%の激レア！\nあなたの守護石は？▼`;

  const res=document.getElementById('result');
  res.innerHTML=`
    <div id="captureArea" style="padding:14px;border-radius:22px;background:#fff;">
    <div class="rarity-badge">🏆 上位 ${S.rarity}% の激レア守護石</div>
    <div class="hero-card" style="background:linear-gradient(135deg,${S.color},${S.color}bb);">
      <div class="hero-emoji">${S.emoji}</div>
      <div class="hero-nick">${S.nick}</div>
      <div class="hero-name">${S.name}</div>
      <div class="hero-catch">守護キーワード：${S.keep}</div>
    </div>
    <div style="font-size:0.7rem;color:#b0a0c0;margin:-2px 0 12px;">💎 守護石診断</div>
    </div><!-- /captureArea -->

    <div class="sec"><h4>💠 ${S.name}の意味（言い伝え）</h4>${S.mean}</div>
    <div class="sec"><h4>🔮 あなたの性質</h4>${S.chara}</div>

    <!-- ★物販導線：そのまま販売ページへ -->
    <div class="buy-box">
      <div class="stone-img">${S.emoji}✨</div>
      <h3>あなたの守護石「${S.name}」</h3>
      <div class="price">¥${S.price.toLocaleString()}〜 <small>（天然石ブレスレット）</small></div>
      <a class="buy-btn" href="${buyUrl}" target="_blank" rel="noopener">🛒 この守護石を見てみる</a>
      <p class="buy-note">お守りとして身につけたい方へ。※効果効能を保証するものではありません</p>
    </div>

    <div class="lucky-row">
      <div class="lucky"><span>🎨 ラッキーカラー</span><b>${S.lucky}</b></div>
      <div class="lucky"><span>📅 ラッキー曜日</span><b>${S.day}</b></div>
      <div class="lucky"><span>💠 守護キーワード</span><b>${S.keep}</b></div>
    </div>

    <div class="locked">
      <div class="sec"><h4>💡 ${S.name}があなたに伝えるアドバイス</h4>${S.advice}</div>
      <div class="compat">
        <div class="compat-box good"><span>💎 相性のいい石</span><b>${goodE}</b></div>
        <div class="compat-box bad"><span>⚡ 組み合わせ注意</span><b>${badE}</b></div>
      </div>
      <div class="lock-overlay">
        <div class="big">🔒💎</div>
        <p>「あなたへのアドバイス」と「相性のいい石」は<br>LINE登録で今すぐ無料解放！</p>
        <a class="unlock-btn" href="${LINE_URL}" target="_blank" rel="noopener" onclick="return checkLine();">📱 LINEで結果を解放する</a>
      </div>
    </div>

    <button class="save-btn" onclick="saveCard()">📸 結果カードを画像で保存（SNSにシェア）</button>
    <div class="share-row">
      <a class="share-btn x" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(location.href)}" target="_blank" rel="noopener">𝕏 で結果をシェア</a>
      <a class="share-btn ln" href="https://line.me/R/msg/text/?${encodeURIComponent(shareText+" "+location.href)}" target="_blank" rel="noopener">LINEで送る</a>
    </div>

    <p style="font-size:0.78rem;color:#b8a;margin-top:10px;">あなたの誕生日：${y}年${m}月${d}日</p>

    <div class="aisho-section">
      <h3>💎 大切な人との「石の相性」は？</h3>
      <p class="aisho-sub">相手の生年月日を入れて即チェック（ペア・プレゼント選びにも）</p>
      <div class="input-row">
        <div class="field"><label>年</label><select id="pyear"></select></div>
        <div class="field"><label>月</label><select id="pmonth"></select></div>
        <div class="field"><label>日</label><select id="pday"></select></div>
      </div>
      <button class="aisho-btn" onclick="shindanAisho()">石の相性を見る 💠</button>
      <div id="aishoResult"></div>
    </div>

    <div class="line-cta">
      <div class="lock">🔒</div>
      <h3>${S.name}さんの「2026年の開運アドバイス」はLINEで無料プレゼント</h3>
      <div class="blur">2026年、あなたの運気が動くのは◯月。持つといい石の組み合わせは△△で、特にお守りにしたい時期は……（続きはLINE登録で全文公開）</div>
      <ul class="line-list">
        <li>✅ あなたの守護石フル診断＆活かし方</li>
        <li>✅ 2026年の開運アドバイス</li>
        <li>✅ 相性のいい石・組み合わせ提案</li>
      </ul>
      <a class="line-btn" href="${LINE_URL}" target="_blank" rel="noopener" onclick="return checkLine();">📱 続きをLINEで受け取る</a>
      <p class="line-sub">友だち追加するだけ・無料 / ブロックはいつでもOK</p>
    </div>
  `;
  res.classList.remove('show'); void res.offsetWidth; res.classList.add('show');
  const py=document.getElementById('pyear'),pm=document.getElementById('pmonth'),pd=document.getElementById('pday');
  for(let yy=2025;yy>=1930;yy--)py.add(new Option(yy+"年",yy));
  for(let mm=1;mm<=12;mm++)pm.add(new Option(mm+"月",mm));
  py.value=1990;pm.value=1;
  const fillPDays=()=>{const dim=new Date(+py.value,+pm.value,0).getDate();pd.innerHTML="";for(let dd=1;dd<=dim;dd++)pd.add(new Option(dd+"日",dd));};
  fillPDays(); py.onchange=fillPDays; pm.onchange=fillPDays;
  res.scrollIntoView({behavior:"smooth",block:"start"});
}
</script>
</body>
</html>
